<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#06070a"><title>Tank Crawler</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="favicon-32x32.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06070a;color:#fff;font-family:Segoe UI,sans-serif}body{min-height:100dvh;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);display:flex;flex-direction:column}#hud{height:52px;background:#090c10;border-bottom:1px solid #23414a;display:flex;align-items:center;justify-content:space-between;padding:6px 8px;gap:6px}.g{display:flex;gap:6px}.s{background:#111821;border:1px solid #29404a;border-radius:8px;padding:5px 7px;font-size:11px;font-weight:800;color:#45f3ff}.hp{color:#ff7777}button{border:0;border-radius:8px;font-weight:900}#p{width:38px;height:34px;background:#14212a;color:white;border:1px solid #35515d}#w{position:relative;flex:1;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;background:#0d1117;touch-action:none}.pad{display:none;position:absolute;bottom:14px;width:108px;height:108px;border-radius:50%;border:1px solid #ffffff30;background:#18222b55;z-index:5;touch-action:none}.pad i{position:absolute;left:35px;top:35px;width:38px;height:38px;border-radius:50%;background:#66fcf1aa}.pad b{position:absolute;bottom:7px;left:0;right:0;text-align:center;font-size:9px;color:#ddd}.a i{background:#ffcc00aa}.l{left:14px}.a{right:14px}.ov{display:none;position:absolute;inset:0;z-index:10;background:#06070af5;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px;overflow:auto}.ov.on{display:flex}.shop{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(680px,100%)}.card{background:#121820;border:1px solid #45f3ff55;border-radius:9px;padding:9px;text-align:left}.card strong{color:#66fcf1;font-size:13px}.card small{display:block;color:#aaa;margin:4px 0 8px}.card button,.go{background:#66fcf1;color:#071014;padding:9px 12px}.go{background:#ffcc00;margin-top:10px}.boss{display:none;position:absolute;top:8px;left:50%;transform:translateX(-50%);z-index:6;background:#000c;border:1px solid #ffcc00;color:#ffcc00;border-radius:8px;padding:5px 9px;font-size:11px;font-weight:900}.flash{position:absolute;top:14%;left:50%;transform:translate(-50%,-50%);font-weight:900;letter-spacing:2px;text-shadow:0 0 12px #45f3ff;z-index:6;opacity:0}@media(max-width:640px),(pointer:coarse){.pad{display:block}.shop{grid-template-columns:1fr}#hud{height:48px}.s{font-size:10px;padding:4px 6px}}</style></head><body>
<div id="hud"><div class="g"><div class="s">SECTOR <span id="lv">1</span></div><div class="s" id="type">SALVAGE</div></div><div class="g"><div class="s">SV <span id="sc">0</span></div><div class="s hp">HP <span id="hp">100</span>%</div><button id="p">Ⅱ</button></div></div>
<div id="w"><canvas id="c"></canvas><div class="boss" id="boss">ELITE TARGETS: <span id="bc">0</span></div><div class="flash" id="fl"></div><div class="pad l" id="mv"><i></i><b>MOVE</b></div><div class="pad a" id="am"><i></i><b>AIM / FIRE</b></div>
<div class="ov" id="shop"><h2>SECTOR CLEARED</h2><p>Spend salvage before advancing.</p><div class="shop" id="sg"></div><button class="go" id="next">ADVANCE</button></div>
<div class="ov" id="pause"><h2>PAUSED</h2><button class="go" id="resume">RESUME</button></div>
<div class="ov" id="over"><h2>GAME OVER</h2><p id="final"></p><p id="best"></p><button class="go" id="restart">RESTART</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),q=id=>document.getElementById(id);let W=1,H=1,D=1,sec=1,score=0,HP=100,MHP=100,state='play',paused=false,last=0,keys={},mouse=false,ang=0,mv={x:0,y:0},fire=false;let p={x:220,y:550,r:18,sp:220,cd:0},bul=[],ene=[],part=[],exit={x:1450,y:550,r:28,on:false},world={w:1600,h:1100},st={rate:1,spread:1,dmg:1,speed:1,hull:1},flash=0;
function resize(){let r=c.getBoundingClientRect();W=r.width;H=r.height;D=Math.min(devicePixelRatio||1,2);c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)}addEventListener('resize',resize);
const R=(a,b)=>a+Math.random()*(b-a),C=(v,a,b)=>Math.max(a,Math.min(b,v)),cam=()=>({x:C(p.x-W/2,0,Math.max(0,world.w-W)),y:C(p.y-H/2,0,Math.max(0,world.h-H))});
function hud(){q('lv').textContent=sec;q('sc').textContent=score;q('hp').textContent=Math.max(0,Math.round(HP));q('bc').textContent=ene.filter(e=>e.on).length}
function sector(){bul=[];ene=[];part=[];p.x=220;p.y=world.h/2;HP=Math.min(MHP,HP+12);let elite=sec%5===0,n=elite?20:Math.min(8+sec*2,34);for(let i=0;i<n;i++){let e;do{e={x:R(500,1480),y:R(90,1010)}}while(Math.hypot(e.x-p.x,e.y-p.y)<300);e.r=elite?20:14;e.hp=e.max=elite?5+sec/5|0:1+sec/4|0;e.sp=elite?75:65+sec*1.5;e.on=true;e.elite=elite;ene.push(e)}exit={x:1470,y:550,r:30,on:false};q('boss').style.display=elite?'block':'none';q('type').textContent=elite?'ELITE':'SALVAGE';q('fl').textContent=elite?'ELITE SECTOR':'SECTOR '+sec;q('fl').style.opacity=1;flash=1;hud()}
function shoot(){if(p.cd>0)return;p.cd=Math.max(.09,.34-st.rate*.035);let n=Math.min(5,st.spread);for(let i=0;i<n;i++){let a=ang+(i-(n-1)/2)*.11;bul.push({x:p.x+Math.cos(a)*24,y:p.y+Math.sin(a)*24,vx:Math.cos(a)*560,vy:Math.sin(a)*560,r:4,t:1.35,d:st.dmg})}}
function end(){state='over';let bs=Math.max(+localStorage.tcbs||0,sec),bv=Math.max(+localStorage.tcbv||0,score);localStorage.tcbs=bs;localStorage.tcbv=bv;q('final').textContent=`Sector ${sec} · ${score} salvage`;q('best').textContent=`Best sector ${bs} · Best salvage ${bv}`;q('over').classList.add('on')}
function upd(dt){if(paused||state!=='play')return;p.cd=Math.max(0,p.cd-dt);let dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+mv.x,dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+mv.y,l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}let sp=p.sp*(1+(st.speed-1)*.12);p.x=C(p.x+dx*sp*dt,40,1560);p.y=C(p.y+dy*sp*dt,40,1060);if(mouse||fire)shoot();for(let b of bul){b.x+=b.vx*dt;b.y+=b.vy*dt;b.t-=dt}for(let e of ene){if(!e.on)continue;let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*e.sp*dt;e.y+=Math.sin(a)*e.sp*dt;if(Math.hypot(p.x-e.x,p.y-e.y)<p.r+e.r){HP-=18*dt;if(HP<=0)end()}}for(let b of bul){if(b.t<=0)continue;for(let e of ene){if(!e.on)continue;if(Math.hypot(b.x-e.x,b.y-e.y)<b.r+e.r){e.hp-=b.d;b.t=0;if(e.hp<=0){e.on=false;score+=e.elite?70:25;for(let i=0;i<6;i++)part.push({x:e.x,y:e.y,vx:R(-80,80),vy:R(-80,80),t:.45})}break}}}bul=bul.filter(b=>b.t>0);for(let z of part){z.x+=z.vx*dt;z.y+=z.vy*dt;z.t-=dt}part=part.filter(z=>z.t>0);exit.on=!ene.some(e=>e.on);if(exit.on&&Math.hypot(p.x-exit.x,p.y-exit.y)<p.r+exit.r){state='shop';q('shop').classList.add('on');shops()}if(flash>0){flash-=dt;q('fl').style.opacity=Math.max(0,flash/.4)}hud()}
function draw(){let k=cam();x.clearRect(0,0,W,H);x.fillStyle='#0d1117';x.fillRect(0,0,W,H);x.save();x.translate(-k.x,-k.y);x.strokeStyle='#17212b';for(let a=0;a<1600;a+=56){x.beginPath();x.moveTo(a,0);x.lineTo(a,1100);x.stroke()}for(let a=0;a<1100;a+=56){x.beginPath();x.moveTo(0,a);x.lineTo(1600,a);x.stroke()}x.strokeStyle='#31404b';x.lineWidth=5;x.strokeRect(2,2,1596,1096);if(exit.on){x.strokeStyle='#66fcf1';x.lineWidth=5;x.beginPath();x.arc(exit.x,exit.y,exit.r,0,7);x.stroke()}for(let e of ene)if(e.on){x.fillStyle=e.elite?'#ffcc00':'#ff4c4c';x.beginPath();x.arc(e.x,e.y,e.r,0,7);x.fill()}x.fillStyle='#fff';for(let b of bul){x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}x.fillStyle='#66fcf1';for(let z of part)x.fillRect(z.x-2,z.y-2,4,4);x.save();x.translate(p.x,p.y);x.fillStyle='#45f3ff';x.fillRect(-18,-13,36,26);x.fillStyle='#18242b';x.fillRect(-22,-17,7,34);x.fillRect(15,-17,7,34);x.rotate(ang);x.fillStyle='#9efcff';x.fillRect(0,-4,30,8);x.beginPath();x.arc(0,0,10,0,7);x.fill();x.restore();x.restore()}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;upd(dt);draw();requestAnimationFrame(loop)}
const ups=[['rate','Rapid Loader','Faster cannon',300],['spread','Split Barrel','More projectiles',500],['dmg','Heavy Shells','More damage',450],['speed','Thrusters','Faster movement',300],['hull','Hull Armor','More max HP + repair',400]];
function shops(){q('sg').innerHTML='';for(let [k,n,d,cost] of ups){let d0=document.createElement('div');d0.className='card';d0.innerHTML=`<strong>${n}</strong><small>${d}</small><button>${cost} Sv</button>`;d0.querySelector('button').onclick=()=>{if(score<cost)return;score-=cost;if(k==='hull'){MHP+=20;HP=Math.min(MHP,HP+35);st.hull++}else st[k]++;hud();shops()};q('sg').appendChild(d0)}}
q('next').onclick=()=>{q('shop').classList.remove('on');sec++;state='play';sector()};function pause(v){if(state!=='play')return;paused=v;q('pause').classList.toggle('on',v);q('p').textContent=v?'▶':'Ⅱ'}q('p').onclick=()=>pause(!paused);q('resume').onclick=()=>pause(false);document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)pause(true)});addEventListener('keydown',e=>{if(e.code.startsWith('Arrow'))e.preventDefault();keys[e.code]=1;if(e.code==='Escape')pause(!paused)});addEventListener('keyup',e=>keys[e.code]=0);c.onmousemove=e=>{let r=c.getBoundingClientRect(),k=cam();ang=Math.atan2(e.clientY-r.top+k.y-p.y,e.clientX-r.left+k.x-p.x)};c.onmousedown=()=>mouse=1;addEventListener('mouseup',()=>mouse=0);
function pad(el,mode){let s=el.querySelector('i'),id=null;function M(e){let t=[...e.touches].find(z=>z.identifier===id);if(!t)return;let r=el.getBoundingClientRect(),X=t.clientX-r.left-54,Y=t.clientY-r.top-54,m=Math.hypot(X,Y),d=Math.min(36,m),nx=m?X/m:0,ny=m?Y/m:0;s.style.transform=`translate(${nx*d}px,${ny*d}px)`;if(mode==='m')mv={x:nx*d/36,y:ny*d/36};else if(m>8){ang=Math.atan2(ny,nx);fire=true}}el.ontouchstart=e=>{e.preventDefault();id=e.changedTouches[0].identifier;M(e)};el.ontouchmove=e=>{e.preventDefault();M(e)};el.ontouchend=e=>{if([...e.changedTouches].some(z=>z.identifier===id)){id=null;s.style.transform='';if(mode==='m')mv={x:0,y:0};else fire=false}}}pad(q('mv'),'m');pad(q('am'),'a');q('restart').onclick=()=>{q('over').classList.remove('on');sec=1;score=0;HP=MHP=100;st={rate:1,spread:1,dmg:1,speed:1,hull:1};state='play';sector()};resize();sector();requestAnimationFrame(loop);if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));
</script></body></html>
