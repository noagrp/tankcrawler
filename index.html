rc(this.x,this.y,this.c,0,7);ctx.stroke();ctx.restore()}}function triggerExplosion(x,y,c){for(let i=0;i<8;i++)particles.push(new Particle(x,y,c))}function triggerAoeExplosion(x,y){particles.push(new Nova(x,y,55+stats.flakLevel*15));triggerExplosion(x,y,'#ffaa00')}function fireMain(){if(fireCooldown>0)return;let bx=player.x+Math.cos(turretAngle)*20,by=player.y+Math.sin(turretAngle)*20,interval=Math.max(5,12-stats.fireRateLevel),s=stats.spread,a=s===1?[0]:s===2?[-.08,.08]:s===3?[0,-.16,.16]:s===4?[-.24,-.08,.08,.24]:[0,-.15,.15,-.3,.3];for(let d of a)bullets.push(new Bullet(bx,by,turretAngle+d,'PLAYER'));fireCooldown=interval}function update(){if(gameState!=='PLAYING')return;let mx=((keys.KeyD||keys.ArrowRight)?1:0)-((keys.KeyA||keys.ArrowLeft)?1:0)+touchMove.x,my=((keys.KeyS||keys.ArrowDown)?1:0)-((keys.KeyW||keys.ArrowUp)?1:0)+touchMove.y,l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}mx*=player.speed;my*=player.speed;if(mx||my){player.angle=Math.atan2(my,mx);let nx=player.x+mx,ny=player.y+my;if(!checkWallCollision(nx,player.y,player.radius))player.x=nx;if(!checkWallCollision(player.x,ny,player.radius))player.y=ny}if(++autoMissileTimer>=Math.max(50,150-stats.missileLevel*18)){if(enemies.some(e=>e.active&&e.type!=='ROCK_BALL'))bullets.push(new Bullet(player.x,player.y,turretAngle,'MISSILE'));autoMissileTimer=0}if(++autoFlakTimer>=110){bullets.push(new Bullet(player.x,player.y,player.angle,'FLAK'));autoFlakTimer=0}if(fireCooldown>0)fireCooldown--;if((isMouseDown||touchFire)&&fireCooldown===0)fireMain();for(let b of bullets)b.update();for(let b of bullets){if(!b.active)continue;if(['PLAYER','MISSILE','FLAK'].includes(b.type)){for(let e of enemies){if(e.active&&Math.hypot(e.x-b.x,e.y-b.y)<=e.radius+b.radius){if(e.type!=='ROCK_BALL'){e.hp-=b.damage;if(b.type==='FLAK')triggerAoeExplosion(b.x,b.y);b.active=false}else b.active=false;if(e.hp<=0){e.active=false;triggerExplosion(e.x,e.y,e.color);score+=e.isSubBoss?450:120;scoreVal.textContent=score;if(mapDepth%5===0){let rem=countActiveSubbosses();subbossCountField.textContent=rem;if(rem<=0)exitPortal.active=true}}break}}}else if((b.type==='ENEMY'||b.type==='VIPER_SHORT_MISSILE')&&Math.hypot(player.x-b.x,player.y-b.y)<=player.radius+b.radius){b.active=false;hp=Math.max(0,hp-(b.type==='VIPER_SHORT_MISSILE'?12:7));hpVal.textContent=Math.floor(hp);if(hp<=0)triggerGameOver()}}bullets=bullets.filter(b=>b.active);for(let e of enemies)e.update();for(let e of enemies)if(e.active&&Math.hypot(player.x-e.x,player.y-e.y)<=player.radius+e.radius){hp=Math.max(0,hp-(e.type==='ROCK_BALL'?3.5:e.isSubBoss?1.8:1));hpVal.textContent=Math.floor(hp);if(hp<=0)triggerGameOver()}enemies=enemies.filter(e=>e.active);particles=particles.filter(p=>p.alpha>0||p.active);for(let p of particles)p.update();if(exitPortal.active&&Math.hypot(player.x-exitPortal.x,player.y-exitPortal.y)<=player.radius+exitPortal.radius)triggerShop()}function draw(){let d=Math.min(devicePixelRatio||1,2),W=canvas.width/d,H=canvas.height/d;ctx.clearRect(0,0,W,H);for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(grid[r][c]===1){let x=c*TILE_SIZE,y=r*TILE_SIZE;block(ctx,x,y,TILE_SIZE,TILE_SIZE,6,'#151c24','#202b36')}if(exitPortal.active){ctx.fillStyle='#45f3ff';ctx.beginPath();ctx.arc(exitPortal.x,exitPortal.y,18+Math.sin(Date.now()*.008)*3,0,7);ctx.fill()}for(let b of bullets)b.draw();for(let e of enemies)e.draw();for(let p of particles)p.draw();draw3DShadow(ctx,player.radius);ctx.save();ctx.translate(player.x,player.y);ctx.save();ctx.rotate(player.angle);treads(ctx,player.radius);block(ctx,-15,-11,30,22,5,'#344456','#445970');ctx.restore();ctx.rotate(turretAngle);ctx.fillStyle='#46586e';ctx.beginPath();ctx.arc(0,0,10,0,7);ctx.fill();ctx.fillStyle='#8a9ba8';ctx.fillRect(0,-3,24,6);ctx.restore()}function loop(){update();draw();requestAnimationFrame(loop)}function renderShop(){shopGrid.innerHTML='';let items=[['fireRate','Shooting Speed Coils','Decreases cannon reload time'],['spread','Projectile Multibarrels','Adds projectiles to the spread'],['flak','Thermal Flak Shells','Larger and stronger flak blast'],['missileUpg','Homing Missile Calibrator','Stronger/faster seeker rockets'],['speed','Overcharged Thrusters','Raises movement speed'],['hullMax','Dreadnought Hull Armor','Raises max hull and repairs']];for(let [t,n,desc] of items){let cost=upgradeCost(t),max=capped(t),d=document.createElement('div');d.className='shop-item';d.innerHTML='<div class="shop-info"><strong>'+n+'</strong><p>'+desc+' · Lv '+levelFor(t)+'/'+CAPS[t]+'</p></div><button '+(max?'disabled':'')+'>'+(max?'MAX':cost+' Sv')+'</button>';d.querySelector('button').onclick=()=>buyUpgrade(t);shopGrid.appendChild(d)}}function triggerShop(){gameState='SHOP';bossHpBarContainer.style.display='none';shopBalanceVal.textContent=score+' Sv';renderShop();shopScreen.style.display='flex'}function buyUpgrade(type){if(capped(type))return;let cost=upgradeCost(type);if(score<cost){alert('Insufficient Salvage Value!');return}score-=cost;scoreVal.textContent=score;shopBalanceVal.textContent=score+' Sv';if(type==='fireRate')stats.fireRateLevel++;else if(type==='spread')stats.spread++;else if(type==='flak')stats.flakLevel++;else if(type==='missileUpg')stats.missileLevel++;else if(type==='speed'){stats.speedLevel++;player.speed=Math.min(5.0,player.speed+.4)}else if(type==='hullMax'){stats.hullLevel++;maxHp+=25}hp=maxHp;hpVal.textContent=Math.floor(hp);renderShop()}function closeShop(){mapDepth++;mapVal.textContent=mapDepth;hp=Math.min(maxHp,hp+maxHp*.25);hpVal.textContent=Math.floor(hp);shopScreen.style.display='none';gameState='PLAYING';generateRogueMap()}function triggerGameOver(){gameState='GAMEOVER';finalLvl.textContent=mapDepth;finalScore.textContent=score;bossHpBarContainer.style.display='none';gameOverScreen.style.display='flex'}function resetGame(){mapDepth=1;score=0;hp=maxHp=100;stats={fireRateLevel:1,spread:1,flakLevel:1,missileLevel:1,damage:1,speedLevel:1,hullLevel:1};player.speed=3.4;scoreVal.textContent=0;hpVal.textContent=100;mapVal.textContent=1;gameOverScreen.style.display='none';gameState='PLAYING';resizeViewport();generateRogueMap()}function pad(el,mode){let stick=el.querySelector('i'),id=null;function move(e){let t=[...e.touches].find(v=>v.identifier===id);if(!t)return;let r=el.getBoundingClientRect(),x=t.clientX-r.left-56,y=t.clientY-r.top-56,m=Math.hypot(x,y),d=Math.min(38,m),nx=m?x/m:0,ny=m?y/m:0;stick.style.transform='translate('+nx*d+'px,'+ny*d+'px)';if(mode==='move')touchMove={x:nx*d/38,y:ny*d/38};else if(m>7){turretAngle=Math.atan2(ny,nx);touchFire=true}}el.addEventListener('touchstart',e=>{e.preventDefault();id=e.changedTouches[0].identifier;move(e)},{passive:false});el.addEventListener('touchmove',e=>{e.preventDefault();move(e)},{passive:false});el.addEventListener('touchend',e=>{if([...e.changedTouches].some(t=>t.identifier===id)){id=null;stick.style.transform='';if(mode==='move')touchMove={x:0,y:0};else touchFire=false}},{passive:false})}pad($('movePad'),'move');pad($('aimPad'),'aim');addEventListener('resize',()=>{resizeViewport();generateRogueMap()});resizeViewport();generateRogueMap();loop();</script></body></html>
